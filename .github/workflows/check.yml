# The cross-platform bootstrap proof (P22, B85): the DOCUMENTED bootstrap,
# nothing more — a red here is a finding about the lock or the docs, fixed
# deliberately (make lock / doc change), never by weakening a test.
name: check

on:
  push:
    branches: [main]
  pull_request:

# A superseded push's matrix is cancelled, never left burning runner
# minutes (B87 §2).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the checkout; the default token gets no write scope.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      # macOS runs ONLY where minutes are free (the public mirror). On the
      # private repo the leg is PAUSED, not ended (M-33, B118, 2026-09-04):
      # macOS bills at 10x and one push-per-commit matrix reached 90% of
      # the plan's included Actions minutes in five days. The proof it
      # gave — the documented bootstrap from nothing on a clean Mac —
      # still runs at every release cut, where this same file lands in the
      # mirror. Reopen when the private repo's minutes are no longer the
      # constraint (a paid Actions plan or a self-hosted macOS runner) or
      # when a macOS-only bootstrap regression ever reaches a cut.
      matrix: ${{ github.event.repository.private && fromJSON('{"os":["ubuntu-latest"]}') || fromJSON('{"os":["ubuntu-latest","macos-latest"]}') }}
    runs-on: ${{ matrix.os }}
    # The suite runs ~3min; its web job-runner tests have polled up to
    # ~11min under load (lessons.md). 30min turns a hang into a legible
    # failure instead of the 6-hour runner default.
    timeout-minutes: 30
    steps:
      # Actions pinned to full commit SHAs (B89): a moving major tag is a
      # supply-chain door into the runner that writes the mirror's proof.
      # checkout v5 = v4 on Node 24 (the runner's Node 20 deprecation
      # annotation, P2-28). setup-uv stays on v5.4.2: its first Node 24
      # release (v7) stacks v6's breaking input changes; bump when GitHub
      # names the Node 20 removal date or the action reds (B118 §3).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The tripwire's history track scans every commit reachable from
          # any ref — a shallow clone would blind it.
          fetch-depth: 0
          # The job only reads; no step pushes, so no token is left in
          # the checkout's git config for a test to find (P2-28).
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          # Only a push to main uses the cache — a pull_request run gets
          # none, so a branch can never seed what main restores (P2-28).
          # Keyed on the hashed lock: the action's default glob never
          # matched requirements.lock, so the cache could never invalidate.
          enable-cache: ${{ github.event_name == 'push' }}
          cache-dependency-glob: requirements.lock

      - name: Bootstrap (the documented path)
        run: |
          uv venv --python 3.11 .venv
          uv pip install --require-hashes -r requirements.lock
          uv pip install --no-deps -e .

      - name: Restricted-token list
        # Private repo: the TRIPWIRE_TOKENS secret (one token per line)
        # becomes the machine-local list, so CI runs the honest full suite.
        # Public mirror: no secret — the committed attestation covers the
        # empty-list posture. Neither present -> the tripwire fails loudly,
        # which is the intended signal to configure one of the two.
        # Push events only (P2-28): a same-repo pull_request runs the
        # PR's own Makefile and tests, and they never get the list on
        # disk — on the private repo such a run reds at the tripwire,
        # loudly, and the reviewer gates it locally instead.
        if: github.event_name == 'push'
        env:
          TRIPWIRE_TOKENS: ${{ secrets.TRIPWIRE_TOKENS }}
        run: |
          if [ -n "$TRIPWIRE_TOKENS" ]; then
            # GitHub masks the secret only as a WHOLE string; a tripwire
            # failure message prints individual tokens, so mask each
            # non-comment line before the file exists (B87 §2).
            printf '%s\n' "$TRIPWIRE_TOKENS" | while IFS= read -r line; do
              case "$line" in ''|'#'*) continue ;; esac
              echo "::add-mask::$line"
            done
            mkdir -p tripwire-local
            printf '%s\n' "$TRIPWIRE_TOKENS" > tripwire-local/tokens.txt
          fi

      - name: Offline suite (zero spend)
        run: make check
