<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFP Engine — guest review</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="guest">
<main class="guestmain">
  <header class="viewhead">
    <div>
      <div class="brand-inline">RFP Engine · guest review</div>
      <h1 id="shareTitle">Loading…</h1>
    </div>
  </header>
  <div id="shareHead" class="facts" hidden></div>
  <p class="muted hint" id="shareNote" hidden>You are reading a draft
    shared with you for comment. Type a comment under any section and
    press <b>Send comment</b>; the pursuit team sees it at once and
    decides whether it reaches the revision. Nothing here goes to a buyer.</p>
  <div id="shareError" class="facts" hidden></div>
  <div id="shareSections" class="rows"></div>
  <section id="yourComments" hidden>
    <h2 class="sub">Your comments</h2>
    <div id="yourCommentRows" class="rows"></div>
  </section>
</main>
<div id="toast" class="toast" hidden></div>
<script src="/static/share.js"></script>
</body>
</html>
