[build-system]
# >=77: the first setuptools that parses the PEP 639 license metadata
# below (SPDX `license` string + `license-files`); 69–76 reject it.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-engine-v2"
version = "0.15.1"
description = "RFP Response Engine v2 — sales engine: draft boldly, verify at the boundary, learn from every review"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0.1,<7",
    "jsonschema>=4.18,<5",
    "anthropic>=0.40,<1",
    # transitive pin: >=46 dropped Intel-macOS wheels and needs a Rust toolchain (v1 lesson)
    "cryptography<46",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
    # P25 item 6 / P26a P0-12: openpyxl and python-docx switch to defusedxml's
    # entity-safe parsers when it is importable — no import of ours, but a
    # declared dependency, never an orphan the lock happened to carry
    "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
# P32d (B149): ruff runs INSIDE the suite (tests/contracts/test_lint.py) over
# engine/, tests/ and tools/ — no make target of its own, so `make check` and
# CI are unchanged. Minor-pinned: rule behaviour moves between ruff minors, so
# a bump is a deliberate edit of this constraint + `make lock`, reviewed as a diff.
dev = ["pytest>=8.2,<9", "playwright>=1.47,<2", "ruff>=0.16,<0.17"]
# Container-only (B51): installed inside docker/extraction-gate.Dockerfile,
# never into .venv — the offline suite must stay torch-free, and this
# host's only native docling path is an abandoned torch pin (mac_intel).
extraction = ["docling>=2.120,<3"]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "extraction: exercises docling — collected only where it is installed (the gate container); deselected by tests/extraction/conftest.py elsewhere, never skipped",
]

# P32d (B149): ruff runs INSIDE the suite — tests/contracts/test_lint.py runs
# `ruff check engine tests tools` with this configuration and pins it, so a
# change here is a deliberate, reviewed change. Lint only: no formatter, no
# mypy (trigger unchanged: the first contributor).
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "BLE", "RUF100"]
# Ignored DELIBERATELY at adoption (B149 §3c), each with its measured count on
# the 2026-10-05 tree and the trigger that reopens it — the lint pass at the
# contributors trigger (with mypy and the formatter) — never silently:
#   E501 line-too-long (191): line length is the formatter's decision
#   E741 ambiguous-variable-name (76, all `l`, 38 files): a rename pass is
#        formatting-grade churn under a pending UAT
#   B904 raise-without-from-inside-except (84, 58 in web/server.py): rewrites
#        the exception chain at 84 raises for traceback shape alone
#   B905 zip-without-explicit-strict (21): `strict=` is a per-site behaviour
#        decision — reopened by that pass or by a ragged-input incident
ignore = ["E501", "E741", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
# A package __init__ import is a re-export by construction — declared once
# here, not as a `noqa` on every line (B149 §3d).
"__init__.py" = ["F401"]
